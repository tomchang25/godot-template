; sim-management preset — project.godot fragment.
; tools/compose.py merges these into the composed project.godot:
;   - [autoload] lines are inserted just before GameManager (preserving the rule
;     that providers come after SaveManager and before GameManager).
;   - any other [section] key overrides the base value.

[autoload]

ExampleSystem="*res://global/autoloads/systems/example_system.gd"
Director="*res://global/autoloads/director/director.gd"
ScriptDirector="*res://global/autoloads/director/script_director.gd"
GameplayOverride="*res://global/autoloads/director/gameplay_override.gd"

[application]

config/name="Sim-Management Template"
run/main_scene="res://game/example_sim/example_sim_scene.tscn"
